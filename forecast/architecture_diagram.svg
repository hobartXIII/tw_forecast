<rect width="1400" height="780" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="800" fill="#1f2937" text-anchor="start">台灣天氣預報系統 — 系統總體架構</text>
<text x="30" y="62" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">兩條流程只透過 Supabase 溝通：後端是唯一的寫入端，前端只以唯讀權限讀取</text>
<rect x="290" y="90" width="340" height="510" rx="14" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="306" y="116" font-size="15" font-weight="700" fill="#4a90d9" text-anchor="start">流程一：後端（GitHub Actions）</text>
<text x="306" y="134" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">src/tw_forecast/backend · service_role 金鑰</text>
