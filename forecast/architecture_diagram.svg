<text x="726" y="116" font-size="15" font-weight="700" fill="#3aa56b" text-anchor="start">Supabase（PostgreSQL）</text>
<text x="726" y="134" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">RLS：anon 只讀預報與狀態</text>
