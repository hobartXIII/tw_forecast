<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 1423" width="1490" height="1423" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1490" height="1423" fill="#ffffff"/>
<text x="30" y="38" font-size="22" font-weight="800" fill="#1f2937">台灣天氣預報系統 — 核心資料流程時序圖</text>
<text x="30" y="60" font-size="12.5" fill="#4b5563">後端排程寫入資料庫，前端只讀；「立即更新」與告警設定都經由伺服器端處理，金鑰不會到瀏覽器</text>
<line x1="130" y1="130" x2="130" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="42" y="84" width="176" height="46" rx="9" fill="#f4f5f7" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="130" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">使用者</text>
<text x="130" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">瀏覽器／手機</text>
<line x1="380" y1="130" x2="380" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="292" y="84" width="176" height="46" rx="9" fill="#fff5e6" stroke="#e8962a" stroke-width="1.6"/>
<text x="380" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">儀表板</text>
<text x="380" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">Streamlit（流程二）</text>
<line x1="630" y1="130" x2="630" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="542" y="84" width="176" height="46" rx="9" fill="#edf9f1" stroke="#3aa56b" stroke-width="1.6"/>
<text x="630" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Supabase</text>
<text x="630" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">PostgreSQL</text>
<line x1="880" y1="130" x2="880" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="792" y="84" width="176" height="46" rx="9" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.6"/>
<text x="880" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">後端 Pipeline</text>
<text x="880" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">GitHub Actions（流程一）</text>
<line x1="1130" y1="130" x2="1130" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="1042" y="84" width="176" height="46" rx="9" fill="#f4f5f7" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="1130" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">氣象署 API</text>
<text x="1130" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">F-D0047-091</text>
<line x1="1380" y1="130" x2="1380" y2="1399" stroke="#b8bec6" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="1292" y="84" width="176" height="46" rx="9" fill="#f4f5f7" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="1380" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Telegram</text>
<text x="1380" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">Bot API</text>
<rect x="440" y="508" width="1040" height="210" rx="8" fill="none" stroke="#c0392b" stroke-width="1.4"/>
<rect x="440" y="508" width="41" height="20" rx="4" fill="#c0392b"/>
<text x="448" y="522" font-size="11.5" font-weight="700" fill="#ffffff">alt</text>
<text x="489" y="523" font-size="12" font-weight="600" fill="#c0392b">只有排程（schedule）才判斷告警；手動只更新資料</text>
<rect x="780" y="644" width="700" height="62" rx="8" fill="none" stroke="#7a5cc4" stroke-width="1.4"/>
<rect x="780" y="644" width="41" height="20" rx="4" fill="#7a5cc4"/>
<text x="788" y="658" font-size="11.5" font-weight="700" fill="#ffffff">opt</text>
<text x="829" y="659" font-size="12" font-weight="600" fill="#7a5cc4">有符合條件的預報時段</text>
<rect x="30" y="948" width="1200" height="215" rx="8" fill="none" stroke="#7a5cc4" stroke-width="1.4"/>
<rect x="30" y="948" width="41" height="20" rx="4" fill="#7a5cc4"/>
<text x="38" y="962" font-size="11.5" font-weight="700" fill="#ffffff">opt</text>
<text x="79" y="963" font-size="12" font-weight="600" fill="#7a5cc4">使用者按下「立即更新」</text>
<rect x="30" y="1177" width="700" height="198" rx="8" fill="none" stroke="#7a5cc4" stroke-width="1.4"/>
<rect x="30" y="1177" width="41" height="20" rx="4" fill="#7a5cc4"/>
<text x="38" y="1191" font-size="11.5" font-weight="700" fill="#ffffff">opt</text>
<text x="79" y="1192" font-size="12" font-weight="600" fill="#7a5cc4">管理者調整告警設定</text>
<rect x="20" y="178" width="1450" height="28" rx="6" fill="#3a7fc4" fill-opacity="0.13" stroke="#3a7fc4"/>
<text x="34" y="197" font-size="14" font-weight="700" fill="#3a7fc4" text-anchor="start">流程一：後端擷取入庫（排程或手動觸發）</text>
<rect x="496.7099999999998" y="222" width="766.5800000000004" height="42" rx="6" fill="#fffbe6" stroke="#e0c341"/>
<text x="880.0" y="241" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">cron（台灣 02:45 起每 3 小時）或 workflow_dispatch 啟動</text>
<text x="880.0" y="256" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">載入 GitHub Secrets，判斷執行來源：schedule／manual</text>
<line x1="880" y1="312" x2="1123" y2="312" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1005.0" y="291" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">GET 一週預報（帶 API Key）</text>
<text x="1005.0" y="306" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">失敗最多重試 3 次；429 直接中止</text>
<line x1="1130" y1="348" x2="887" y2="348" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="1005.0" y="342" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">回傳未來 1 週預報 JSON</text>
<path d="M880,368 h30 v36 h-30" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="918" y="383" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">ForecastParser 解析</text>
<text x="918" y="398" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">補時區、缺值轉 NULL</text>
<line x1="880" y1="456" x2="637" y2="456" stroke="#3a7fc4" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="755.0" y="435" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">upsert weather_forecasts</text>
<text x="755.0" y="450" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">（單一交易，service_role）</text>
<line x1="880" y1="492" x2="637" y2="492" stroke="#3a7fc4" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="755.0" y="486" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">記錄 pipeline_status（success + 時間）</text>
<line x1="630" y1="570" x2="873" y2="570" stroke="#3a7fc4" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="755.0" y="549" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">讀取 alert_city_settings／alert_slot_settings</text>
<text x="755.0" y="564" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">讀不到就不發送（fail closed）</text>
<path d="M880,590 h30 v36 h-30" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="918" y="605" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">alerts：發送時段、判斷視窗、</text>
<text x="918" y="620" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">降雨／低溫／高溫條件</text>
<line x1="880" y1="692" x2="1373" y2="692" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1130.0" y="686" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">POST sendMessage：告警訊息（token 不外洩）</text>
<rect x="20" y="742" width="1450" height="28" rx="6" fill="#d98a1f" fill-opacity="0.13" stroke="#d98a1f"/>
<text x="34" y="761" font-size="14" font-weight="700" fill="#d98a1f" text-anchor="start">流程二：前端讀庫呈現（Streamlit）</text>
<line x1="130" y1="802" x2="373" y2="802" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="255.0" y="796" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">開啟頁面、選擇地區或縣市</text>
<line x1="380" y1="852" x2="623" y2="852" stroke="#2e9560" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="505.0" y="831" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">唯讀查詢：pipeline_status、目前時段、</text>
<text x="505.0" y="846" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">未來預報（anon 金鑰，RLS）</text>
<line x1="630" y1="888" x2="387" y2="888" stroke="#2e9560" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="505.0" y="882" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">資料列（只取最新一批 updated_at）</text>
<path d="M380,908 h30 v22 h-30" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="418" y="923" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">渲染摘要、地圖、圖表與表格</text>
<line x1="130" y1="996" x2="373" y2="996" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="255.0" y="990" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">按下按鈕</text>
<path d="M380,1016 h30 v36 h-30" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="418" y="1031" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">update_gate：距上次成功滿 20 分鐘，</text>
<text x="418" y="1046" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">且觸發後 5 分鐘內尚無新紀錄則鎖定</text>
<line x1="380" y1="1104" x2="873" y2="1104" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="630.0" y="1083" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">POST workflow_dispatch（GH_DISPATCH_TOKEN）</text>
<text x="630.0" y="1098" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">記下觸發時間，60 秒後自動重整</text>
<rect x="574.2" y="1124" width="611.5999999999999" height="27" rx="6" fill="#fffbe6" stroke="#e0c341"/>
<text x="880.0" y="1143" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">後端回到流程一（手動執行：只更新資料、不推播）</text>
<line x1="130" y1="1225" x2="373" y2="1225" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="255.0" y="1219" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">輸入管理者密碼</text>
<line x1="380" y1="1261" x2="623" y2="1261" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="505.0" y="1255" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">RPC admin_get_alert_settings(密碼)</text>
<line x1="630" y1="1311" x2="387" y2="1311" stroke="#d98a1f" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="505.0" y="1290" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">bcrypt 驗證通過 → 回傳設定</text>
<text x="505.0" y="1305" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">錯誤密碼被拒絕並延遲約 1 秒</text>
<line x1="380" y1="1361" x2="623" y2="1361" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="505.0" y="1340" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">RPC admin_save_alert_settings</text>
<text x="505.0" y="1355" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">（前端先驗證門檻範圍，資料庫再以 CHECK 把關）</text>
</svg>